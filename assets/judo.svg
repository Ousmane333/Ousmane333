<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" role="img" aria-label="Animation de judo : une projection qui se termine par un ippon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#031A24"/>
      <stop offset="55%" stop-color="#0B3C49"/>
      <stop offset="100%" stop-color="#0E5A6B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="240" rx="14" fill="url(#bg)"/>

  <!-- étoiles qui scintillent -->
  <g fill="#A5F3FC">
    <circle cx="70" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="35" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="70" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- tatami -->
  <rect x="40" y="200" width="820" height="40" fill="#04202B"/>
  <g stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2">
    <path d="M40 200 H860"/>
  </g>
  <g stroke="#0E7490" stroke-opacity="0.5" stroke-width="1.5">
    <path d="M180 200 V240M320 200 V240M460 200 V240M600 200 V240M740 200 V240"/>
  </g>

  <!-- onde d'impact à l'atterrissage -->
  <ellipse cx="250" cy="203" rx="10" ry="3" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0">
    <animate attributeName="rx" values="10;10;10;80;80" keyTimes="0;0.49;0.5;0.62;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="3;3;3;12;12" keyTimes="0;0.49;0.5;0.62;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.49;0.5;0.62;1" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- UKE (celui qui est projeté) : kimono bleu, ceinture marron -->
  <g transform="translate(480 200)">
    <g>
      <animateTransform attributeName="transform" type="translate" additive="replace"
        values="0 0;0 0;-125 -110;-230 53;-230 53;-230 53;0 0;0 0"
        keyTimes="0;0.25;0.40;0.50;0.85;0.95;0.96;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;1;1;0;0;1"
        keyTimes="0;0.25;0.40;0.50;0.85;0.95;0.96;1" dur="5s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0 0 -65;0 0 -65;-140 0 -65;-270 0 -65;-270 0 -65;-270 0 -65;0 0 -65;0 0 -65"
          keyTimes="0;0.25;0.40;0.50;0.85;0.95;0.96;1" dur="5s" repeatCount="indefinite"/>
        <g stroke-linecap="round" fill="none">
          <path d="M0 -70 L-10 0M0 -70 L10 0" stroke="#0E7490" stroke-width="12"/>
          <path d="M0 -108 L0 -68" stroke="#0891B2" stroke-width="24"/>
          <path d="M0 -105 L-32 -98M0 -100 L-30 -84" stroke="#0891B2" stroke-width="9"/>
          <rect x="-13" y="-76" width="26" height="7" rx="2" fill="#92400E" stroke="none"/>
        </g>
        <circle cx="0" cy="-130" r="13" fill="#E6B88A"/>
        <path d="M-13 -134 Q0 -150 13 -134" fill="#0B1220" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- TORI (celui qui projette) : kimono blanc, ceinture noire -->
  <g transform="translate(420 200)">
    <g>
      <animateTransform attributeName="transform" type="rotate" additive="replace"
        values="0 0 -65;0 0 -65;30 0 -65;30 0 -65;30 0 -65;0 0 -65;0 0 -65;0 0 -65"
        keyTimes="0;0.25;0.38;0.55;0.85;0.95;0.96;1" dur="5s" repeatCount="indefinite"/>
      <g stroke-linecap="round" fill="none">
        <path d="M0 -70 L-10 0M0 -70 L10 0" stroke="#A5F3FC" stroke-width="12"/>
        <path d="M0 -108 L0 -68" stroke="#E6FBFF" stroke-width="24"/>
        <path d="M0 -105 L32 -98M0 -100 L30 -84" stroke="#E6FBFF" stroke-width="9"/>
        <rect x="-13" y="-76" width="26" height="7" rx="2" fill="#0B1220" stroke="none"/>
      </g>
      <circle cx="0" cy="-130" r="13" fill="#E6B88A"/>
      <path d="M-13 -134 Q0 -150 13 -134" fill="#0B1220" stroke="none"/>
    </g>
  </g>

  <!-- IPPON ! -->
  <g opacity="0" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" filter="url(#glow)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.55;0.85;0.92;1" dur="5s" repeatCount="indefinite"/>
    <text x="250" y="110" font-size="34" font-weight="700" fill="#22D3EE">IPPON !</text>
    <text x="250" y="135" font-size="15" fill="#A5F3FC" letter-spacing="4">一本</text>
  </g>

  <!-- légende -->
  <text x="860" y="124" text-anchor="end" font-family="'Fira Code', Consolas, monospace" font-size="15" fill="#7DD3E0" letter-spacing="2">JUDO</text>
  <text x="860" y="148" text-anchor="end" font-family="'Fira Code', Consolas, monospace" font-size="12" fill="#22D3EE" fill-opacity="0.7">tomber sept fois, se relever huit</text>
</svg>
